<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>AI Product Trend Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
  /* Ink on white with one amber accent. Amber is used once per page: the highlighter on the top headline. */
  :root{
    --bg:#ffffff; --surface:#f3f4f6; --fg:#0a0d14; --muted:#5b6170; --line:#e2e5ea; --dot:#e3e6eb;
    --mark:#ffb020;
    --font-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --r-s:6px; --r-l:12px; --strip-h:53px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.2px);
    background-size:24px 24px;background-position:12px 12px}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
  a{color:inherit}
  h1,h2{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.06;text-wrap:balance}
  p{margin:0;text-wrap:pretty}
  ol{list-style:none;margin:0;padding:0}
  :focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  em{font-style:normal;padding:0 .07em;margin:0 -.07em;
    background:linear-gradient(to top,transparent 9%,var(--mark) 9%,var(--mark) 47%,transparent 47%);
    -webkit-box-decoration-break:clone;box-decoration-break:clone}

  .label{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--muted);line-height:1.4}
  .kicker{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.02em;line-height:1.4}
  .kicker::before{content:"> ";opacity:.6}
  .chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:.12em .5em;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-s);
    background:var(--fg);color:var(--bg);font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
  .btn:hover{background:#23283a}
  .src{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.02em;
    text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
  .src:hover{text-decoration-color:var(--fg)}

  /* ---------- Top strip: name on the left, day controls on the right ---------- */
  .strip{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:var(--strip-h);padding:6px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand .short{display:none}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button{height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);
    font-family:var(--font-mono);font-size:13px;letter-spacing:.02em}
  .stepper button:hover:not(:disabled){border-color:var(--fg)}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper .datebtn{padding:0 12px;gap:8px}

  /* ---------- Page: section rail and one ranked column ---------- */
  .page{max-width:1040px;margin:0 auto;padding:44px 32px 96px;display:grid;grid-template-columns:172px minmax(0,1fr);gap:64px}
  .rail{position:sticky;top:calc(var(--strip-h) + 44px);align-self:start}
  .rail .label{display:block;margin:0 10px 10px}
  .sec{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:38px;padding:0 10px;margin-bottom:2px;
    border-radius:var(--r-s);font-family:var(--font-mono);font-size:13px;letter-spacing:.02em}
  .sec span{color:var(--muted)}
  .sec:hover{background:var(--surface)}
  .sec.on{background:var(--fg);color:var(--bg)}
  .sec.on span{color:inherit;opacity:.7}

  .col{max-width:720px;min-width:0}
  .lead .top{display:flex;justify-content:space-between;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
  .lead h1{font-size:clamp(32px,5vw,56px);line-height:1.04;margin:20px 0 22px}
  .lead p{font-size:19px;line-height:1.5;color:var(--muted);max-width:34em}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lead .tags{display:flex;gap:8px;margin-top:22px}
  .lead .meta{margin-top:24px;gap:14px}

  .list{margin-top:60px}
  .story{display:grid;grid-template-columns:56px minmax(0,1fr);padding:26px 0 30px;border-top:1px solid var(--line)}
  .num{font-family:var(--font-mono);font-size:15px;font-weight:500;letter-spacing:.02em;line-height:22px}
  .num.inline{display:none}
  .story h2{font-size:24px;letter-spacing:-.03em;line-height:1.15;margin:10px 0}
  .story p{color:var(--muted);line-height:1.55;max-width:38em;margin-bottom:12px}
  .story .meta .label{margin-left:2px}
  .sources{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;line-height:1.6;color:var(--muted);
    border-top:1px solid var(--line);padding-top:20px;margin-top:8px}
  .status{font-family:var(--font-mono);font-size:13px;color:var(--muted);padding:48px 0}
  .err{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:16px 18px;font-size:15px;line-height:1.55}

  /* ---------- Archive: every brief as a calendar ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none}
  .sheet.open{display:block}
  .sheet .back{position:absolute;inset:0;background:rgba(10,13,20,.38)}
  .sheet .panel{position:absolute;top:0;right:0;bottom:0;width:372px;max-width:100%;background:var(--bg);
    border-left:1px solid var(--line);display:flex;flex-direction:column}
  .sheet .phead{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 6px 20px;
    min-height:var(--strip-h);border-bottom:1px solid var(--line)}
  .sheet .close{width:44px;height:44px;display:grid;place-items:center;font-family:var(--font-mono);font-size:18px}
  .sheet .months{overflow-y:auto;padding:8px 20px 32px;-webkit-overflow-scrolling:touch}
  .month{padding:18px 0 6px}
  .month .mname{display:flex;justify-content:space-between;margin-bottom:10px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .dow{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:2px}
  .cal .d{aspect-ratio:1;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;border-radius:var(--r-s);
    color:var(--muted);opacity:.45}
  .cal button.d{opacity:1;color:var(--fg);background:var(--surface);border:1px solid var(--line)}
  .cal button.d:hover{border-color:var(--fg)}
  .cal button.d.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}

  /* ---------- Phones and narrow windows ---------- */
  @media (max-width:860px){
    .strip{padding:6px 12px 6px 16px}
    .brand .full{display:none}
    .brand .short{display:inline}
    .page{display:block;padding:0 16px 72px}
    .rail{top:var(--strip-h);z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
      margin:0 -16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
    .rail::-webkit-scrollbar{display:none}
    .rail:empty{display:none}
    .rail .label{display:none}
    .sec{flex:0 0 auto;width:auto;min-height:44px;gap:8px;padding:0 12px;margin:0;border:1px solid var(--line);background:var(--surface)}
    .sec.on{border-color:var(--fg)}
    .col{padding-top:28px;max-width:none}
    .lead h1{margin:16px 0 18px}
    .lead p{font-size:17px}
    .list{margin-top:44px}
    .story{display:block;padding:22px 0 26px}
    .num.side{display:none}
    .num.inline{display:inline;margin-right:4px}
    .story h2{font-size:21px}
    .story p{margin-bottom:2px}
    .src{display:inline-flex;align-items:center;min-height:44px}
    .sheet .panel{top:auto;left:0;width:100%;height:86%;border-left:0;border-top:1px solid var(--line);
      border-radius:var(--r-l) var(--r-l) 0 0}
  }
</style>
</head>
<body>
<header class="strip">
  <span class="kicker brand"><span class="full">ai product trend radar</span><span class="short">trend radar</span></span>
  <div class="stepper">
    <button id="older" aria-label="Older brief" disabled>←</button>
    <button id="openArchive" class="datebtn" aria-haspopup="dialog" disabled><span id="dateLbl">Archive</span><span aria-hidden="true">▾</span></button>
    <button id="newer" aria-label="Newer brief" disabled>→</button>
  </div>
</header>
<div class="page">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="col" id="col"><div class="status">Loading latest brief…</div></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Archive">
  <div class="back" id="sheetBack"></div>
  <div class="panel">
    <div class="phead"><span class="kicker" id="sheetTitle">archive</span><button class="close" id="sheetClose" aria-label="Close archive">×</button></div>
    <div class="months" id="months"></div>
  </div>
</div>
<script>
/* ===== CONFIG ===== */
// Briefs are read straight from the repo, so a new brief shows up as soon as the daily workflow commits it.
// On GitHub Pages the repo comes from the page's own address, so renaming or forking the repo keeps the page working.
const BRIEFS_URL = (()=>{
  const owner = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const repo = location.pathname.split("/").filter(Boolean)[0];
  return (owner && repo)
    ? "https://raw.githubusercontent.com/"+owner+"/"+repo+"/main/briefs/"
    : "https://raw.githubusercontent.com/tgraharms/ai-product-trend-radar/main/briefs/";
})();
/* ================= */

const CATS = [["AI","AI"],["TECH","Tech"],["COMMUNITY","Community"],["CAREER","Career"],["CONSUMER","Consumer"]];
const CATLABEL = Object.fromEntries(CATS);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pad = n => String(n).padStart(2,"0");
const fmt = (iso, o) => new Date(iso+"T12:00:00").toLocaleDateString("en-GB", o);
const fmtLong = iso => fmt(iso, {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const fmtShort = iso => fmt(iso, {weekday:"short", day:"numeric", month:"short"});
const domain = url => { try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; } };

function parseBrief(raw){
  const lines = raw.replace(/\\(.)/g,"$1").split(/\n/).map(l=>l.trim());
  let sources="", cat=null, sub=null, items=[], cur=null;
  for(const ln of lines){
    if(!ln || ln.startsWith("# ")) continue;
    const subm = ln.match(/^###\s+(.+)/);
    if(subm){ sub = subm[1].trim(); cur=null; continue; }
    const cm = ln.match(/^##\s+(.+)/);
    if(cm){ cat = cm[1].trim().toUpperCase().split(/\s|—/)[0]; sub=null; cur=null; continue; }
    if(/^sources:/i.test(ln)){ sources=ln; cur=null; continue; }
    const sm = ln.match(/^SRC:\s*(\S+)/);
    if(sm){ if(cur) cur.src=sm[1]; continue; }
    const im = ln.match(/^\[(\d+)\]\s*(.+)/);
    if(im){ cur={cat:cat||"AI", sub:sub, score:parseInt(im[1],10), headline:im[2], body:"", src:""}; items.push(cur); continue; }
    if(cur) cur.body = cur.body? cur.body+" "+ln : ln;
  }
  // Highest score first. Stories with the same score keep the order they were written in.
  items = items.map((it,i)=>({...it, i})).sort((a,b)=> b.score-a.score || a.i-b.i);
  return {items, sources};
}

// The highlighter marks the opening phrase of the top headline: its first clause if that is short, else its first four words.
function emphasise(h){
  const words = h.split(" ");
  const cut = h.search(/[,:;]| [—–-] /);
  let n = cut>0 ? h.slice(0,cut).split(" ").length : 0;
  if(n<2 || n>6) n = Math.min(4, words.length);
  while(n>2 && /^(a|an|the|at|of|to|in|on|for|with|and|its|as|by|from)$/i.test(words[n-1])) n--;
  const m = words.slice(0,n).join(" ").match(/^(.*?)([,:;]?)$/), tail = words.slice(n).join(" ");
  return "<em>"+esc(m[1])+"</em>"+esc(m[2])+(tail? " "+esc(tail) : "");
}

let DATES=[], PARSED=null, activeDate=null, activeTab="ALL";

function tags(it){
  return '<span class="chip">'+(CATLABEL[it.cat]||esc(it.cat))+'</span>'+(it.sub?'<span class="chip">'+esc(it.sub)+'</span>':'');
}

function render(){
  const p=PARSED, counts={ALL:p.items.length};
  CATS.forEach(([k])=> counts[k]=p.items.filter(i=>i.cat===k).length);
  $('rail').innerHTML = '<span class="label">sections</span>'
    + [["ALL","All"], ...CATS].filter(([k])=>counts[k]).map(([k,l])=>
      '<button class="sec'+(k===activeTab?' on':'')+'" data-tab="'+k+'" aria-pressed="'+(k===activeTab)+'">'+l+'<span>'+pad(counts[k])+'</span></button>').join('');
  document.querySelectorAll('.sec').forEach(s=> s.onclick=()=>{ activeTab=s.dataset.tab; render(); window.scrollTo(0,0); });

  const list = p.items.filter(it=> activeTab==="ALL" || it.cat===activeTab);
  if(!list.length){ $('col').innerHTML='<div class="status">No stories in this brief.</div>'; return; }
  const lead=list[0], rest=list.slice(1);
  const words = list.reduce((a,it)=> a + (it.body? it.body.split(/\s+/).length : 0), 0);
  const mins = Math.max(1, Math.round(words/200));
  let html = '<article class="lead"><div class="top"><span class="kicker">'+fmtLong(activeDate).toLowerCase()+'</span>'
    + '<span class="label">'+list.length+(list.length===1?' story':' stories')+' · '+mins+' min read</span></div>'
    + '<h1>'+emphasise(lead.headline)+'</h1><p>'+esc(lead.body)+'</p>'
    + '<div class="tags">'+tags(lead)+'<span class="chip">score '+lead.score+'/10</span></div>'
    + (lead.src?'<div class="meta"><a class="btn" href="'+esc(lead.src)+'" target="_blank" rel="noopener">Read the source ↗</a><span class="label">'+esc(domain(lead.src))+'</span></div>':'')
    + '</article>';
  if(rest.length) html += '<ol class="list">'+rest.map((it,i)=>
    '<li class="story"><span class="num side">'+pad(i+2)+'</span><div><div class="meta"><span class="num inline">'+pad(i+2)+'</span>'
    + tags(it)+'<span class="label">score '+it.score+'/10</span></div>'
    + '<h2>'+esc(it.headline)+'</h2><p>'+esc(it.body)+'</p>'
    + (it.src?'<a class="src" href="'+esc(it.src)+'" target="_blank" rel="noopener">'+esc(domain(it.src))+' ↗</a>':'')+'</div></li>').join('')+'</ol>';
  if(p.sources) html += '<p class="sources">'+esc(p.sources)+'</p>';
  $('col').innerHTML = html;
}

function syncStepper(){
  const i = DATES.indexOf(activeDate);
  $('dateLbl').textContent = fmtShort(activeDate);
  $('openArchive').disabled = false;
  $('older').disabled = i >= DATES.length-1;
  $('newer').disabled = i <= 0;
}

async function loadDay(date){
  activeDate=date; activeTab="ALL"; syncStepper();
  $('rail').innerHTML=''; $('col').innerHTML='<div class="status">Loading…</div>';
  try {
    const res = await fetch(BRIEFS_URL+date+".md");
    if(!res.ok) throw new Error("brief "+res.status);
    const txt = await res.text();
    if(date!==activeDate) return;   // a newer click has already replaced this one
    if(!txt){ $('col').innerHTML='<div class="status">This brief is empty.</div>'; return; }
    PARSED = parseBrief(txt); render(); window.scrollTo(0,0);
  } catch(e){
    if(date!==activeDate) return;
    $('col').innerHTML='<div class="err">Couldn\'t load this brief ('+esc(String(e.message||e))+'). If this just went live, give it a minute and refresh.</div>';
  }
}

/* ----- Archive calendar: one grid per month, newest first. Days with a brief are buttons. ----- */
const sheet = $('sheet');
function openArchive(){
  const has = new Set(DATES);
  $('sheetTitle').textContent = 'archive · '+DATES.length+' briefs';
  $('months').innerHTML = [...new Set(DATES.map(d=>d.slice(0,7)))].map(m=>{
    const [y,mo] = m.split("-").map(Number);
    const days = new Date(y,mo,0).getDate(), lead = (new Date(y,mo-1,1).getDay()+6)%7;
    let cells = ["M","T","W","T","F","S","S"].map(d=>'<span class="dow">'+d+'</span>').join('') + '<span></span>'.repeat(lead), count=0;
    for(let d=1; d<=days; d++){
      const iso = m+"-"+pad(d);
      if(has.has(iso)){ count++; cells += '<button class="d'+(iso===activeDate?' on':'')+'" data-date="'+iso+'" aria-label="'+fmtLong(iso)+'">'+d+'</button>'; }
      else cells += '<span class="d">'+d+'</span>';
    }
    return '<div class="month"><div class="mname"><span class="kicker">'+fmt(m+"-01",{month:"long",year:"numeric"}).toLowerCase()
      + '</span><span class="label">'+count+(count===1?' brief':' briefs')+'</span></div><div class="cal">'+cells+'</div></div>';
  }).join('');
  document.querySelectorAll('#months button.d').forEach(b=> b.onclick=()=>{ closeArchive(); loadDay(b.dataset.date); });
  sheet.classList.add('open'); $('openArchive').setAttribute('aria-expanded','true'); $('sheetClose').focus();
}
function closeArchive(){
  sheet.classList.remove('open'); $('openArchive').setAttribute('aria-expanded','false'); $('openArchive').focus();
}
$('openArchive').onclick = openArchive;
$('sheetClose').onclick = closeArchive;
$('sheetBack').onclick = closeArchive;
$('older').onclick = ()=> loadDay(DATES[DATES.indexOf(activeDate)+1]);
$('newer').onclick = ()=> loadDay(DATES[DATES.indexOf(activeDate)-1]);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && sheet.classList.contains('open')) closeArchive(); });

async function init(){
  try {
    // The query string skips the CDN cache so today's brief appears right after it's committed.
    const res = await fetch(BRIEFS_URL+"index.json?v="+Date.now());
    if(!res.ok) throw new Error("index "+res.status);
    const data = await res.json();
    DATES = (data.briefs||[]).filter(d=> /^\d{4}-\d{2}-\d{2}$/.test(d)).sort((a,b)=> b.localeCompare(a));
    if(!DATES.length){ $('col').innerHTML='<div class="status">No briefs published yet. Check back after the next morning update.</div>'; return; }
    loadDay(DATES[0]);
  } catch(e){
    $('col').innerHTML='<div class="err"><b>Couldn\'t reach the briefs.</b><br>'+esc(String(e.message||e))
      +'<br><br>Check that briefs/index.json exists in the repo and the repo is public.</div>';
  }
}
init();
</script>
</body>
</html>
